# Research theme cards. 'icon' is one of: atom, network, molecule, glass, beaker, chip, bot.
# 'link' and 'link_text' are optional and add a small link at the bottom of a card.
- title: AI agents for science
  icon: bot
  text: >-
    LLM-powered agents that plan experiments, analyze data, and run simulations, so that
    physics-based modeling becomes a tool an autonomous workflow can pick up and use.
  link: https://github.com/ziatdinovmax/SciLink
  link_text: See SciLink

- title: Active learning & uncertainty
  icon: network
  text: >-
    Bayesian and probabilistic machine learning that knows what it does not know, used to decide
    which simulation or experiment to run next and to steer autonomous synthesis.

- title: Atomistic modeling
  icon: atom
  text: >-
    Density functional theory, ab initio molecular dynamics, and machine-learned interatomic
    potentials for amorphous materials, surfaces, catalysts, and CO<sub>2</sub> capture solvents.

- title: Glass & waste form design
  icon: glass
  text: >-
    Informatics-driven design of nuclear waste glasses, combining curated datasets, surrogate
    models, and sequential learning to predict stability and crystallization.
