# Research theme cards, read as a pipeline from physics to automation.
# 'icon' is one of: atom, network, molecule, glass, beaker, chip, bot.
# 'link' and 'link_text' are optional and add a small link at the bottom of a card.
- title: Atomistic simulation
  icon: atom
  text: >-
    DFT, ab initio molecular dynamics, and machine-learned interatomic potentials for amorphous
    materials, surfaces, and interfaces.

- title: Probabilistic machine learning
  icon: network
  text: >-
    Bayesian and uncertainty-aware models, from surrogate models over curated datasets to per-atom
    uncertainty in learned potentials, so predictions come with a measure of trust.

- title: Active learning & autonomous experiments
  icon: beaker
  text: >-
    Sequential design and Bayesian optimization that choose the next simulation or experiment, and
    closed loops that run them on real instruments.

- title: AI agents for science
  icon: bot
  text: >-
    LLM-powered agents that plan, analyze, and simulate, so that physics-based modeling becomes a
    tool an autonomous workflow can pick up and use.
  link: https://github.com/ziatdinovmax/SciLink
  link_text: See SciLink
