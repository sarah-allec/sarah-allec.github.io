# Shown in the About section. Each item is one paragraph. Basic HTML such as <em> and <a> is allowed.
about:
  - >-
    I am a computational materials scientist on the
    <a href="https://www.pnnl.gov/people/sarah-allec">Materials Discovery Team</a> at
    <a href="https://www.pnnl.gov/">Pacific Northwest National Laboratory</a>, where I specialize in
    <em>ab initio</em> modeling and active learning to help bridge the gap between simulations and
    experiments. I previously worked as a research scientist at
    <a href="https://citrine.io/">Citrine Informatics</a>, specializing in materials informatics, and
    before that as a postdoc in PNNL's Basic &amp; Applied Molecular Foundations group, studying
    CO<sub>2</sub> capture and heterogeneous catalysis.
  - >-
    I earned my B.S. in Applied Mathematics with an emphasis in Physics from UC Riverside in 2015,
    then stayed for a Ph.D. in Materials Science &amp; Engineering, first in Bryan Wong's
    <a href="http://www.bmwong-group.com/">Nanoscale &amp; Mesoscale Energy Materials group</a> and then in
    Alex Greaney's <a href="http://alexgreaney.com/">Computational Materials Group</a>. My dissertation focused
    on atomistic modeling of amorphous materials, particularly amorphous metal oxides and
    water-in-salt electrolytes.
  - >-
    In my research I combine atomistic modeling at both the electronic (quantum) and atomic (classical)
    levels with machine learning, and increasingly with LLM-based agents: I am a core contributor to
    <a href="https://github.com/ziatdinovmax/SciLink">SciLink</a>, an open-source platform of agents for
    automating scientific research, where I build the simulation agents. I am passionate about finding new
    ways to solve problems in materials science and chemistry <em>in silico</em> in order to accelerate
    scientific discovery.

